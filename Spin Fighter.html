<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spin Fighter</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe9f1;--bg2:#d8e8ff;--ink:#1a1230;--mut:#5f5780;--card:#fff;--line:#1a1230;--acc:#ff3d77;--acc2:#6d4dff;--gold:#ffb800;--hp:#1fbf8f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1448;--bg2:#0e1740;--ink:#f6f0ff;--mut:#b5a9e0;--card:#1d1642;--line:#f6f0ff}}
:root[data-theme="dark"]{--bg1:#2a1448;--bg2:#0e1740;--ink:#f6f0ff;--mut:#b5a9e0;--card:#1d1642;--line:#f6f0ff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% 10%,#ff3d7755,transparent 40%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed}
main{max-width:680px;margin:0 auto;padding:18px 14px 40px}
h1,h2,.bang,button{font-family:Teko,Impact,"Arial Black",sans-serif;font-weight:600;letter-spacing:.04em}
h1{font-size:clamp(40px,11vw,64px);line-height:.95;margin:0;color:var(--acc);text-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg);display:inline-block}
.tag{color:var(--mut);margin:8px 0 14px}
h2{font-size:26px;margin:0 0 8px}
.card{background:var(--card);border:3px solid var(--line);border-radius:16px;box-shadow:5px 5px 0 var(--line);padding:14px;margin-bottom:16px}
button{font-size:24px;background:var(--acc);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px 26px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);color-scheme:light}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,.opt:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
button.alt{background:var(--acc2)}
.hide{display:none!important}
.crt{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start}
@media(max-width:480px){.crt{grid-template-columns:1fr;justify-items:center}}
.pv{width:150px;background:linear-gradient(var(--bg1),var(--bg2));border:3px solid var(--line);border-radius:14px}
.pv svg,.fgt svg{display:block;width:100%}
label{display:block;font-weight:700;margin:10px 0 4px;font-size:14px}
input[type=text]{width:100%;font:inherit;padding:8px 10px;border:3px solid var(--line);border-radius:10px;background:var(--bg1);color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0;box-shadow:none;font-size:15px}
.opt.sel{outline:3px solid var(--gold);outline-offset:2px}
.opt.txt{width:auto;border-radius:10px;padding:0 12px;background:var(--bg1);color:var(--ink);font-size:18px}
.stage{display:flex;flex-direction:column;align-items:center}
.wrap{position:relative;width:min(84vw,330px);aspect-ratio:1}
canvas{width:100%;height:100%;border-radius:50%;transition:transform 4s cubic-bezier(.12,.7,.1,1);box-shadow:0 0 0 6px var(--ink),0 0 30px #ff3d7788}
.ptr{position:absolute;left:50%;top:-14px;transform:translateX(-50%);border:15px solid transparent;border-top:30px solid var(--gold);border-bottom:0;z-index:2;filter:drop-shadow(0 2px 0 var(--ink))}
.hub{position:absolute;inset:41%;border-radius:50%;background:var(--gold);border:4px solid var(--ink);z-index:1}
.cat{font:600 34px Teko,Impact,sans-serif;margin:14px 0 0;min-height:40px;text-align:center}
.sheet{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 14px;margin-top:10px;font-size:14px}
.sheet div{display:flex;justify-content:space-between;gap:6px;border-bottom:2px dotted var(--mut);padding:2px 0}
.sheet span{color:var(--mut)}.sheet b{text-align:right}
.arena{position:relative;overflow:hidden;border:3px solid var(--line);border-radius:16px;box-shadow:5px 5px 0 var(--line);background:linear-gradient(#ff9ac0,#ffd9a0 55%,#7a4fb0 56%,#4a2c80);height:300px;margin-bottom:12px}
.arena:before{content:"";position:absolute;right:12%;top:10%;width:70px;height:70px;border-radius:50%;background:#fff6d0;box-shadow:0 0 40px #fff6}
.arena.ult{animation:dark .9s}
.hud{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:10px;z-index:5}
.hud>div{flex:1}.hud b{font:600 18px Teko,sans-serif;color:#fff;text-shadow:2px 2px 0 #1a1230}
.bar{height:14px;background:#1a1230;border:2px solid #1a1230;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--hp);transition:width .4s}
.bar.m{height:8px;margin-top:3px}.bar.m i{width:0;background:var(--gold)}
.fgt{position:absolute;bottom:14px;width:130px;transition:filter .2s}
.fgt.p{left:7%}.fgt.e{right:7%}.fgt.e .in{transform:scaleX(-1)}
.fgt .wp{position:absolute;top:60%;left:62%;font-size:34px}.fgt.e .wp{left:auto;right:62%;transform:scaleX(-1)}
.fgt.p{--d:110px}.fgt.e{--d:-110px}
.lunge{animation:lunge .55s}.shake{animation:shake .45s;filter:brightness(2) saturate(2)}.dodge{animation:dodge .5s;opacity:.6}.ko{animation:ko 1s forwards}.idle .in{animation:bob 2s infinite}
@keyframes lunge{50%{transform:translateX(var(--d)) scale(1.1)}}
@keyframes shake{20%{transform:translateX(-12px) rotate(-4deg)}50%{transform:translateX(12px) rotate(4deg)}80%{transform:translateX(-6px)}}
@keyframes dodge{50%{transform:translateX(calc(var(--d)*-.5)) skewX(12deg)}}
@keyframes ko{to{transform:translateY(40px) rotate(80deg);opacity:0}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes dark{30%,70%{filter:brightness(.4)}}
.fgt.e.idle .in{animation:none}
.pop{position:absolute;font:600 36px Teko,sans-serif;color:#fff;text-shadow:3px 3px 0 #ff3d77,-1px -1px 0 #1a1230;animation:up 1s forwards;z-index:6;pointer-events:none}
.pop.crit{font-size:52px;color:var(--gold)}
@keyframes up{to{transform:translateY(-60px) scale(1.3);opacity:0}}
.slash{position:absolute;width:140px;height:8px;background:#fff;box-shadow:0 0 12px #fff,0 0 4px #ff3d77;transform:rotate(-35deg);animation:sl .3s forwards;z-index:4}
@keyframes sl{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0);opacity:0}}
.banner{position:absolute;left:0;right:0;top:38%;text-align:center;font:600 40px Teko,sans-serif;color:#fff;background:linear-gradient(90deg,transparent,#ff3d77cc 20%,#6d4dffcc 80%,transparent);padding:4px 0;text-shadow:3px 3px 0 #1a1230;z-index:7;animation:ban 1.4s forwards}
@keyframes ban{0%{transform:translateX(-100%)}20%,80%{transform:none}100%{transform:translateX(100%)}}
.flash{position:absolute;inset:0;background:#fff;z-index:8;animation:fl .25s forwards;pointer-events:none}
@keyframes fl{to{opacity:0}}
.log{max-height:150px;overflow-y:auto;font-size:14px}.log p{margin:3px 0}
.win{font:600 44px Teko,sans-serif;text-align:center;margin:6px 0;color:var(--acc);text-shadow:3px 3px 0 var(--ink)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}canvas{transition-duration:.5s}}

.card{border:1px solid #ffffff44;border-radius:14px;box-shadow:0 10px 30px #0005,inset 0 1px 0 #ffffff25}
h1{transform:none;letter-spacing:.08em;text-shadow:0 0 20px #ff3d77aa,0 2px 0 #0008}h2{font-size:30px}
button{font-size:26px;border:1px solid #ffffff66;border-radius:10px;background:linear-gradient(#ff5c8a,#e02a62);box-shadow:0 4px 14px #ff3d7766,inset 0 1px 0 #fff5}
button.alt{background:linear-gradient(#8a6dff,#5a3de0);box-shadow:0 4px 14px #6d4dff66,inset 0 1px 0 #fff5}
button:active{transform:translateY(2px)}
.opt{border:2px solid #fff8;box-shadow:0 1px 4px #0006;font-size:20px;margin:0}.opt.sel{outline:2px solid var(--gold);outline-offset:2px}.opt.txt{background:var(--bg2);color:var(--ink);border-color:#ffffff44}.opt.txt.sel{background:var(--acc2);color:#fff}
.crt{grid-template-columns:200px 1fr}.pv{width:200px;position:sticky;top:8px;border:1px solid #fff6;overflow:hidden;background:radial-gradient(circle at 50% 30%,var(--bg1),var(--bg2));box-shadow:inset 0 0 30px #0005}
.grp{margin-top:12px}.grp h3{margin:0 0 6px;font:600 18px Teko,sans-serif;letter-spacing:.06em;color:var(--mut)}
input[type=text]{border:1px solid #fff6}
.arena{border:1px solid #ffffff66;box-shadow:0 10px 30px #0006;background:radial-gradient(circle at 80% 22%,#fff3c4 0 5%,#ffb3c855 6% 16%,transparent 17%),linear-gradient(#1f1450,#b83d78 58%,#ff9a76)}
.arena:before{display:none}.arena:after{content:"";position:absolute;left:0;right:0;bottom:0;height:48%;z-index:1;background:linear-gradient(#241757,#0a0720);clip-path:polygon(0 55%,9% 30%,20% 52%,34% 14%,48% 46%,62% 20%,78% 52%,90% 26%,100% 46%,100% 100%,0 100%)}
.fgt{width:150px;bottom:-34px;z-index:3}.fgt.p{left:5%}.fgt.e{right:5%}
.bar{border:1px solid #fff8;background:#0009}.hud b{font-size:22px}
@media(max-width:480px){.pv{position:static}}

.fgt{width:170px;bottom:-30px}
.fgt .in{-webkit-mask-image:linear-gradient(#000 74%,transparent 98%);mask-image:linear-gradient(#000 74%,transparent 98%)}
.fgt .wp,.fgt.e .wp{position:absolute;font-size:0;width:34px;height:100px;top:auto;bottom:34px;left:auto;right:-10px;transform:rotate(22deg);transform-origin:50% 90%;filter:drop-shadow(0 3px 3px #0008)}
.fgt.e .wp{right:auto;left:-10px;transform:scaleX(-1) rotate(22deg)}
.wp svg{width:100%;height:100%;display:block}
.sw{animation:swg .55s}.fgt.e .sw{animation:swg2 .55s}
@keyframes swg{50%{transform:rotate(110deg)}}@keyframes swg2{50%{transform:scaleX(-1) rotate(110deg)}}
.arena{height:330px}
.ring{position:absolute;width:20px;height:20px;margin:-10px;border:4px solid;border-radius:50%;animation:rg 1.1s backwards forwards;z-index:6;pointer-events:none}
@keyframes rg{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(12)}}
.pt{position:absolute;font-size:22px;z-index:6;pointer-events:none;animation:pt 1.1s forwards}
@keyframes pt{to{transform:translate(var(--x),var(--y)) scale(.3) rotate(240deg);opacity:0}}
.beam{position:absolute;height:28px;border-radius:14px;z-index:5;transform-origin:left;animation:bm 1s forwards;pointer-events:none}
@keyframes bm{from{transform:scaleX(0)}30%{transform:scaleX(1)}to{transform:scaleX(1);opacity:0}}
.hole{position:absolute;width:100px;height:100px;margin:-50px;border-radius:50%;background:radial-gradient(#000 35%,#6b2dd8 62%,transparent 70%);z-index:4;animation:hl 1.3s forwards}
@keyframes hl{from{transform:scale(0)}40%{transform:scale(1.3) rotate(180deg)}to{transform:scale(0) rotate(360deg)}}
.crush{animation:cr 1s}@keyframes cr{40%,70%{transform:scaleY(.6) translateY(34px)}}
.warp{animation:wpp 1s}@keyframes wpp{50%{filter:hue-rotate(120deg) saturate(2);transform:skewX(3deg) scale(1.03)}}
.quake{animation:qk .9s}@keyframes qk{20%{transform:translate(-6px,4px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,2px)}}
.clone{position:absolute!important;z-index:2;opacity:.65;filter:brightness(.35) saturate(2);animation:cl .9s forwards}
@keyframes cl{to{transform:translateX(var(--d));opacity:0}}

.crt{grid-template-columns:190px 1fr}.pv{width:190px}
.arena{height:350px}
.fgt{width:112px;bottom:6px}
.fgt .in{-webkit-mask-image:none;mask-image:none}
.fgt .wp,.fgt.e .wp{width:26px;height:78px;bottom:114px;right:-16px}
.fgt.e .wp{right:auto;left:-16px}
.tfa{position:absolute;inset:-6% -45%;z-index:-1;border-radius:50%;animation:tp .7s infinite alternate;pointer-events:none}
@keyframes tp{to{transform:scale(1.15);opacity:.6}}
.fgt{width:130px}.fgt .wp,.fgt.e .wp{bottom:108px;right:14px}.fgt.e .wp{left:14px;right:auto}
.pv{background:radial-gradient(circle at 50% 35%,var(--bg1),var(--bg2))}
.fgt{width:120px}.fgt .wp,.fgt.e .wp{bottom:128px;right:14px}.fgt.e .wp{left:14px;right:auto}
.pv{width:200px}.crt{grid-template-columns:200px 1fr}

.banner{white-space:nowrap;font-size:clamp(20px,5.4vw,40px)}
.pillar{position:absolute;bottom:0;width:80px;height:92%;margin-left:-40px;background:linear-gradient(transparent,var(--c) 60%,transparent);transform-origin:bottom;z-index:2;filter:blur(3px);animation:pil 1.3s both;pointer-events:none}
@keyframes pil{0%{transform:scaleY(.1);opacity:0}25%{transform:scaleY(1);opacity:.9}100%{transform:scaleY(1.1);opacity:0}}
.wing{position:absolute;width:96px;height:130px;border-radius:100% 0 100% 0;background:linear-gradient(135deg,#fff,var(--c) 70%,transparent);z-index:2;animation:wg 1.5s both;pointer-events:none}
@keyframes wg{from{transform:scale(.2);opacity:0}30%{transform:scale(1);opacity:.95}to{transform:scale(1.15);opacity:0}}
.spiral{position:absolute;width:150px;height:150px;margin:-75px;border-radius:50%;background:repeating-conic-gradient(#d40000 0 12deg,#111 12deg 24deg);-webkit-mask-image:radial-gradient(circle,#000 30%,transparent 70%);mask-image:radial-gradient(circle,#000 30%,transparent 70%);z-index:3;animation:spr 1.6s forwards;pointer-events:none}
@keyframes spr{from{transform:scale(0) rotate(0)}to{transform:scale(1.6) rotate(540deg);opacity:0}}
.orb{position:absolute;width:44px;height:44px;margin:-22px;border-radius:50%;background:var(--c);box-shadow:0 0 24px 8px var(--c);z-index:5;animation:ob 1s forwards;pointer-events:none}
@keyframes ob{from{transform:scale(.2)}50%{transform:scale(1.2)}to{transform:scale(2.4);opacity:0}}
.slk{position:absolute;height:3px;width:120px;background:#fff;box-shadow:0 0 8px #f33;z-index:6;animation:sk .4s both;pointer-events:none}
@keyframes sk{0%{opacity:1;clip-path:inset(0 100% 0 0)}100%{opacity:0;clip-path:inset(0)}}
.tor{position:absolute;left:50%;top:32%;font-size:120px;white-space:nowrap;transform:translate(-50%,-50%);z-index:5;opacity:0;animation:trr 1.6s forwards;font-family:Teko,sans-serif;text-shadow:0 0 20px var(--c);pointer-events:none}
@keyframes trr{30%,70%{opacity:.9}to{opacity:0}}
.fgt.bounce:not(.lunge):not(.shake):not(.dodge):not(.ko){animation:bnc .5s infinite}
@keyframes bnc{50%{translate:0 -14px}}

#stg{background:#000;border-color:#2c2c33;color:#fff}
.cat{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:0 0 16px;min-height:0}
.wemo{font-size:44px;line-height:1}.wpill{background:#1c1c21;color:#2f8bff;padding:2px 18px;border-radius:12px;font:600 30px Teko,system-ui,sans-serif}
.wbonus{font:700 48px Teko,system-ui,sans-serif;color:#fff}
.wres{font:700 clamp(30px,8vw,44px)/1.1 Teko,system-ui,sans-serif;color:#fff;margin-top:14px;min-height:48px;text-align:center}
.ptr{display:none}
.hub{inset:39%;background:#0b0b0e;border:6px solid #3a3a42}
.hub:before{content:"";position:absolute;left:50%;top:-24px;transform:translateX(-50%);border:13px solid transparent;border-top:0;border-bottom:22px solid #0b0b0e}
canvas{box-shadow:0 0 0 4px #2c2c33,0 0 0 8px #0b0b0e}
.wres.wpp{animation:wpop .22s}
@keyframes wpop{0%{transform:scale(.6);opacity:.25}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}

@media(min-width:600px){
#stg{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"cat wrap" "res wrap" "btn btn";align-items:center;column-gap:20px}
#stg .cat{grid-area:cat;align-self:end;margin:0 0 6px;flex-direction:row}
#stg .wemo{flex-basis:100%;text-align:center}
#stg .wrap{grid-area:wrap;width:100%;max-width:340px;justify-self:center}
#stg .wres{grid-area:res;align-self:start;margin-top:10px;min-height:110px}
#stg #spin{grid-area:btn;justify-self:center}
}
</style></head><body><main>
<h1>Spin Fighter</h1>
<p class="tag" id="tag">Create your hero, spin your destiny, win the tournament arc.</p>

<section id="s1" class="card"><h2>Create your hero</h2>
<div class="crt"><div class="pv" id="pv"></div><div>
<label for="nm">Name</label><input type="text" id="nm" maxlength="14" value="Akira"><div id="cf"></div></div></div>
<div class="row" style="margin-top:14px"><button class="alt" id="rz">Randomize</button><button id="go">Start spinning</button></div></section>

<section id="s2" class="hide"><div class="card hide" id="trc"><h2>Choose your OmniTrial</h2><p class="tag" style="margin:0 0 10px">Can your build solo it? Every wave is tougher than the last.</p><div id="trl"></div></div><div class="card stage" id="stg">
<div class="cat" id="cat"></div><div class="wrap"><div class="ptr"></div><canvas id="w" width="660" height="660"></canvas><div class="hub"></div></div>
<div class="wres" id="wres"></div><button id="spin">SPIN</button></div>
<div class="card"><h2 id="shn">Your hero</h2><div class="sheet" id="sheet"></div></div></section>

<section id="s3" class="hide">
<div class="arena" id="arena"><div class="hud"><div><b id="n1"></b><div class="bar"><i id="h1"></i></div><div class="bar m"><i id="m1"></i></div></div><div><b id="n2" style="float:right"></b><div class="bar" style="clear:both"><i id="h2"></i></div><div class="bar m"><i id="m2"></i></div></div></div>
<div class="fgt p idle" id="f1"></div><div class="fgt e idle" id="f2"></div></div>
<div class="card log" id="log"></div>
<div id="end" class="hide"><div class="win" id="wn"></div><div class="row" id="eb"></div></div></section>
</main>
<script>
var $=function(i){return document.getElementById(i)},INK='#1a1230';
var TIERS=['Street level','Building level','Town level','City level','Mountain level','Island level','Continental','Planetary','Stellar','Galactic','Universal','Multiversal'];
var SPEEDS=['Human','Peak human','Subsonic+','Supersonic','Hypersonic','Massively hypersonic','Relativistic','Faster than light','Massively FTL','Omnipresent','Instant','Infinite'];
function P(t,s,v){return{t:t,s:s,v:v}}
var CATS=[
{k:'atk',n:'Strength',o:TIERS.map(function(t,i){return{t:t,v:i+1}})},
{k:'spd',n:'Speed',o:SPEEDS.map(function(t,i){return{t:t,v:i+1}})},
{k:'dur',n:'Durability',o:TIERS.map(function(t,i){return{t:t,v:i+1}})},
{k:'pow',n:'Power',o:[P('Time stop','spd',3),P('Regeneration','dur',3),P('Reality warp','atk',3),P('Shadow clones','spd',2),P('Spirit burst','atk',3),P('Gravity crush','atk',2),P('Titan form','dur',3),P('Lucky streak','atk',0),P('Lightning storm','spd',2),P('Flame dragon','atk',3),P('Frost prison','dur',2),P('Void collapse','atk',3),P('Sharingan','spd',2),P('Mangekyō Sharingan','atk',3),P('Eternal Mangekyō Sharingan','atk',4),P('Rinnegan','spd',3),P('Limitless','dur',4),P('Malevolent Shrine','atk',4)]},
